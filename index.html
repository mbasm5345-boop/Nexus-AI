<!DOCTYPE html><html lang="ar" dir="rtl"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus AI</title>
    <link rel="stylesheet" href="style.css">
</head><body><div class="app">

    <!-- الشريط الجانبي -->
    <aside class="sidebar">
        <div class="brand">
            🤖 <span>Nexus AI</span>
        </div>

        <button class="new-chat" id="newChatBtn">
            ＋ محادثة جديدة
        </button>

        <div class="sidebar-title">
            المحادثات
        </div>

        <div id="chatHistory" class="chat-history"></div>

        <div class="sidebar-bottom">
            <button>⚙️ الإعدادات</button>
            <button>ℹ️ حول Nexus AI</button>
        </div>
    </aside>


    <!-- منطقة المحادثة -->
    <main class="chat-area">

        <header class="chat-header">
            <div>
                <h1>Nexus AI</h1>
                <span>مساعدك الذكي</span>
            </div>

            <button id="shareBtn" class="icon-btn" title="مشاركة المحادثة">
                📤
            </button>
        </header>


        <!-- الرسائل -->
        <section id="chatBox" class="messages">

            <div class="welcome">
                <div class="welcome-icon">🤖</div>

                <h2>أهلًا بك في Nexus AI</h2>

                <p>
                    كيف يمكنني مساعدتك اليوم؟
                </p>

                <div class="quick-actions">
                    <button>📚 حل واجب</button>
                    <button>📝 كتابة تقرير</button>
                    <button>📄 تحليل ملف</button>
                    <button>💡 شرح درس</button>
                </div>
            </div>

        </section>


        <!-- منطقة الكتابة -->
        <div class="composer-wrapper">

            <div id="filePreview" class="file-preview"></div>

            <div class="composer">

                <button id="attachBtn" class="attach-btn" title="إرفاق ملف">
                    ＋
                </button>

                <input
                    type="file"
                    id="fileUpload"
                    hidden
                    multiple
                    accept=".pdf,.doc,.docx,.ppt,.pptx,.xls,.xlsx,.txt,.csv,.jpg,.jpeg,.png,.webp"
                >

                <textarea
                    id="userInput"
                    rows="1"
                    placeholder="اكتب رسالتك إلى Nexus AI..."
                ></textarea>

                <button id="sendBtn" class="send-btn" title="إرسال">
                    ➤
                </button>

            </div>

            <div class="composer-info">
                Nexus AI قد يخطئ أحيانًا، لذا راجع المعلومات المهمة.
            </div>

        </div>

    </main>

</div>

<script src="script.js"></script>

</body></html>
