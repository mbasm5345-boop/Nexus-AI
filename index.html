<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus AI</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>🤖 Nexus AI</h1>
    <p>مساعدك الذكي لإنجاز المهام الأكاديمية</p>
</header>

<main>

    <div class="chat-box" id="chatBox">
        🤖 Nexus AI جاهز للمحادثة...
    </div>


    <div class="ai-box">

        <textarea id="userInput" placeholder="اكتب طلبك هنا..."></textarea>

        <input type="file" id="fileUpload">

        <button id="sendBtn">
            ✨ إرسال
        </button>

    </div>


    <h2>الخدمات</h2>

    <div class="services">

        <div class="card">📚 حل الواجبات</div>

        <div class="card">📝 الأبحاث والتقارير</div>

        <div class="card">📊 العروض التقديمية</div>

        <div class="card">📄 إنشاء CV</div>

        <div class="card">📑 السكليف والخطابات</div>

        <div class="card">✍️ إعادة الصياغة</div>

    </div>

</main>


<script src="script.js"></script>

</body>

</html>
